[project]
name = "comfyui-z-engineer"
description = "Z-Image-Engineer for ComfyUI: load the Qwen3-4B prompt model (sharded HF safetensors or GGUF) as a Z-Image text encoder, run local in-ComfyUI prompt enhancement with live preview, and run the fast LFM2.5-1.2B Engineer as a standalone enhancer (CUDA/ROCm/CPU) - no external LLM server required."
version = "2.2.1"
license = { file = "LICENSE" }
dependencies = ["requests", "gguf>=0.10.0"]

[project.urls]
Repository = "https://github.com/BennyDaBall930/ComfyUI-Z-Engineer"
Documentation = "https://github.com/BennyDaBall930/ComfyUI-Z-Engineer#readme"
"Bug Tracker" = "https://github.com/BennyDaBall930/ComfyUI-Z-Engineer/issues"

[tool.comfy]
PublisherId = "bennydaball"
DisplayName = "ComfyUI Z-Engineer"
Icon = ""
